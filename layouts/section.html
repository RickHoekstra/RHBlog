{{ define "main" }}
<h1 class="page-title">{{ .Title }}</h1>
{{ partial "topics.html" . }}
{{ range .RegularPages.GroupByDate "2006" }}
<section class="archive">
  <h2>{{ .Key }}</h2>
  <ul>
    {{ range .Pages }}
    <li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan" }}</time><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>
</section>
{{ end }}
{{ end }}
